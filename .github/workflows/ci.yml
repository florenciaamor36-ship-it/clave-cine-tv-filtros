name: Build Clave Cine TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cine
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare upstream LibreTube and La Clave brand
        run: |
          curl -fsSL https://codeload.github.com/libre-tube/LibreTube/zip/refs/heads/master -o /tmp/upstream.zip
          mkdir upstream
          unzip -q /tmp/upstream.zip -d upstream
          mv upstream/LibreTube-master source
          curl -fsSL https://raw.githubusercontent.com/florenciaamor36-ship-it/la-clave-videos/zapia/clave-mode/BRAND_OVERLAY.zip -o /tmp/brand.zip
          unzip -oq /tmp/brand.zip -d source
          mkdir -p source/app/src/main/java/com/github/libretube/ui/adapters
          python3 - <<'PYCARD'
          from pathlib import Path
          import base64
          Path("source/app/src/main/java/com/github/libretube/ui/adapters/CineCardAdapter.kt").write_bytes(base64.b64decode(""))
          PYCARD
          python3 - <<'PYNOADS'
          from pathlib import Path
          import re
          root = Path("source/app/src/main")
          home = root / "java/com/github/libretube/ui/fragments/HomeFragment.kt"
          text = home.read_text()
          for line in [
              "import android.net.Uri\n", "import android.os.Handler\n", "import android.os.Looper\n",
              "import android.view.Gravity\n", "import android.widget.ImageView\n", "import android.widget.LinearLayout\n",
              "import android.widget.TextView\n"
          ]:
              text = text.replace(line, "")
          text = re.sub(r"(?m)^import com\.google\.android\.material\.(?:chip\.Chip|dialog\.MaterialAlertDialogBuilder)\n", "", text)
          text = text.replace("import com.google.android.material.snackbar.Snackbar\n", "import com.google.android.material.chip.Chip\nimport com.google.android.material.dialog.MaterialAlertDialogBuilder\nimport com.google.android.material.snackbar.Snackbar\n")
          text = re.sub(r"    private val promoHandler = Handler\(Looper.getMainLooper\(\)\)\n    private var promoTimer: Runnable\? = null\n    private var promoDialog: androidx\.appcompat\.app\.AlertDialog\? = null\n", "", text)
          text = re.sub(r"\n        binding\.claveWhatsappPromo\.setOnClickListener \{.*?\n        \}\n        if \(savedInstanceState == null\) view\.post \{ if \(isAdded\) showClavePromo\(\) \}\n", "\n", text, flags=re.S)
          text = re.sub(r"        promoTimer\?\.let\(promoHandler::removeCallbacks\)\n        promoTimer = null\n        promoDialog\?\.dismiss\(\)\n        promoDialog = null\n", "", text)
          text, count = re.subn(r"    private fun showClavePromo\(\) \{.*?\n    private fun fetchHomeFeed\(\)", "    private fun fetchHomeFeed()", text, flags=re.S)
          if count != 1:
              raise SystemExit("No se pudo retirar el temporizador promocional de Inicio")
          home.write_text(text)
          layout = root / "res/layout/fragment_home.xml"
          xml = layout.read_text()
          xml, count = re.subn(r"\s*<ImageView\s+android:id=\"@\+id/claveWhatsappPromo\".*?/>\s*", "\n", xml, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("No se encontró el banner promocional de Inicio")
          layout.write_text(xml)
          for path in (root / "res/drawable-nodpi").glob("clave_ad_*.jpg"):
              path.unlink()
          (root / "res/drawable-nodpi/clave_whatsapp_button.jpg").unlink(missing_ok=True)
          for folder in ["values", "values-es", "values-b+es+419"]:
              path = root / "res" / folder / "strings.xml"
              if not path.exists():
                  continue
              xml = path.read_text()
              xml = re.sub(r"\s*<string name=\"clave_(?:promo_title|whatsapp|ad_seconds|ad_close)\">.*?</string>", "", xml)
              path.write_text(xml)
          home_text = home.read_text()
          lines = home_text.splitlines(keepends=True)
          seen_imports = set()
          cleaned = []
          for line in lines:
              if line.startswith("import "):
                  if line in seen_imports:
                      continue
                  seen_imports.add(line)
              cleaned.append(line)
          home.write_text("".join(cleaned))
          PYNOADS
          python3 - <<'PYAPP'
          from pathlib import Path
          import re
          path = Path("source/app/build.gradle.kts")
          text = path.read_text()
          text, count = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "ar.com.laclave.cineytv"', text, count=1)
          if count != 1:
              raise SystemExit("No se pudo asignar un identificador independiente")
          text = re.sub(r'\s*applicationIdSuffix\s*=\s*"[^"]+"', '', text, count=1)
          text = text.replace('resValue("string", "app_name", "Clave Video Debug")', 'resValue("string", "app_name", "La Clave Cine TV")')
          path.write_text(text)
          PYAPP
          mkdir -p source/app/src/main/java/com/github/libretube/ui/fragments source/app/src/main/java/com/github/libretube/ui/models/sources source/app/src/main/res/layout source/app/src/main/res/values source/app/src/main/res/values-es source/app/src/main/res/values-b+es+419
          cp cine/app/src/main/java/com/github/libretube/ui/fragments/SearchResultFragment.kt source/app/src/main/java/com/github/libretube/ui/fragments/
          cp cine/app/src/main/java/com/github/libretube/ui/models/sources/SearchPagingSource.kt source/app/src/main/java/com/github/libretube/ui/models/sources/
          cp cine/app/src/main/java/com/github/libretube/ui/models/sources/SearchPagingSource.kt /tmp/original-SearchPagingSource.kt
          python3 - <<'PYPAGE'
          from pathlib import Path
          import base64
          Path("source/app/src/main/java/com/github/libretube/ui/models/sources/SearchPagingSource.kt").write_bytes(base64.b64decode(""))
          PYPAGE
          cp cine/app/src/main/res/layout/fragment_search_result.xml source/app/src/main/res/layout/
          python3 - <<'PYHOME'
          from pathlib import Path
          import base64
          layout = Path("source/app/src/main/res/layout/fragment_home.xml")
          text = layout.read_text()
          marker_pattern = r'(?m)^(\s*)<LinearLayout\s+android:id="@\+id/featuredTV"'
          block = base64.b64decode("").decode()
          if "@+id/cineTypeGroup" not in text:
              match = __import__("re").search(marker_pattern, text)
              if not match:
                  raise SystemExit("No se encontró el inicio de la lista de Inicio")
              text = text[:match.start()] + block + text[match.start():]
              layout.write_text(text)
          path = Path("source/app/src/main/java/com/github/libretube/ui/fragments/HomeFragment.kt")
          text = path.read_text()
          if "cineTypeGroup" not in text:
              text = text.replace("import com.google.android.material.dialog.MaterialAlertDialogBuilder", "import com.google.android.material.chip.Chip\nimport com.google.android.material.dialog.MaterialAlertDialogBuilder")
              marker = "        binding.bookmarksRV.layoutManager = CarouselLayoutManager(UncontainedCarouselStrategy())"
              addition = base64.b64decode("").decode()
              if marker not in text:
                  raise SystemExit("No se encontró inicialización de HomeFragment")
              text = text.replace(marker, addition + marker, 1)
              imports = "import androidx.lifecycle.lifecycleScope\nimport com.github.libretube.extensions.toID\n"
          if "import androidx.lifecycle.lifecycleScope" not in text:
              text = text.replace("import androidx.fragment.app.Fragment\n", "import androidx.fragment.app.Fragment\n" + imports)
          path.write_text(text)
          PYHOME
          python3 - <<'PYIMPORTS'
          from pathlib import Path
          path = Path("source/app/src/main/java/com/github/libretube/ui/fragments/HomeFragment.kt")
          lines = path.read_text().splitlines(keepends=True)
          seen = set()
          out = []
          for line in lines:
              if line.startswith("import "):
                  if line in seen:
                      continue
                  seen.add(line)
              out.append(line)
          path.write_text("".join(out))
          PYIMPORTS
          cp cine/app/src/main/res/layout/fragment_search_suggestions.xml source/app/src/main/res/layout/
          cp cine/app/src/main/java/com/github/libretube/ui/fragments/SearchSuggestionsFragment.kt source/app/src/main/java/com/github/libretube/ui/fragments/
          python3 - <<'PYMAIN'
          from pathlib import Path
          path = Path("source/app/src/main/java/com/github/libretube/ui/activities/MainActivity.kt")
          text = path.read_text()
          path.write_text(text)
          PYMAIN
          python3 - <<'PYSTRINGS'
          from pathlib import Path
          labels = {
              "values": {"cine_movies": "Movies", "cine_series": "Series", "cine_live": "Live TV", "cine_music": "Music"},
              "values-es": {"cine_movies": "Películas", "cine_series": "Series", "cine_live": "TV en vivo", "cine_music": "Música"},
              "values-b+es+419": {"cine_movies": "Películas", "cine_series": "Series", "cine_live": "TV en vivo", "cine_music": "Música"},
          }
          for folder, entries in labels.items():
              path = Path("source/app/src/main/res") / folder / "strings.xml"
              text = path.read_text()
              for key, value in entries.items():
                  if f'name="{key}"' not in text:
                      text = text.replace("</resources>", f'    <string name="{key}">{value}</string>\n</resources>')
              path.write_text(text)
          PYSTRINGS
      - name: Build debug APK
        working-directory: source
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clave-cine-tv-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
